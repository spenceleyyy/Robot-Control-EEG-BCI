; LSL reads this file from the current working directory, which is why the
; launcher runs everything from the project folder.
;
; Windows machines usually have a pile of virtual network adapters - VPN
; clients, Hyper-V, VirtualBox, Docker - and LSL's multicast discovery can
; end up looking on the wrong one and finding nothing, even when the
; connector is running on the same PC.
;
; KnownPeers tells LSL to also ask localhost directly over unicast. This is
; additive: normal multicast discovery still happens, so a connector running
; on another machine on your network will still be found.
;
; If you ever move the amplifier to a different computer and things stop
; working, add that machine's IP to the list, or just delete this file.

[lab]
KnownPeers = {127.0.0.1}

; Uncomment if discovery is still unreliable. This narrows the search to your
; own machine and local link, which is faster but will NOT find an amplifier
; running on another computer.
; [multicast]
; ResolveScope = link
